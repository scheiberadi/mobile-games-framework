<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3f0"/><stop offset="1" stop-color="#ffc9e3"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3b478"/><stop offset="1" stop-color="#c9945a"/></linearGradient>
    <linearGradient id="awning" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd766"/><stop offset="1" stop-color="#ffb84d"/></linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98a4f"/><stop offset="1" stop-color="#a86a37"/></linearGradient>
  </defs>

  <rect width="1920" height="620" fill="url(#wall)"/>
  <rect y="620" width="1920" height="280" fill="url(#floor)"/>
  <line x1="0" y1="620" x2="1920" y2="620" stroke="#5b3a29" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Striped awning over the doorway (purely decorative, sits above both shelves) -->
  <path d="M760 90 Q 960 30 1160 90 L1160 150 Q 960 96 760 150 Z" fill="url(#awning)" stroke="#5b3a29" stroke-width="8" stroke-linejoin="round"/>
  <g stroke="#5b3a29" stroke-width="2">
    <polygon points="760,150 820,150 812,90 754,96" fill="#ffffff"/>
    <polygon points="880,150 940,150 936,86 876,90" fill="#ffffff"/>
    <polygon points="1000,150 1060,150 1058,86 998,90" fill="#ffffff"/>
    <polygon points="1120,150 1160,150 1160,90 1122,96" fill="#ffffff"/>
  </g>

  <!-- Two shelves, spanning most of the width, with bracket supports; item icons and price labels are placed on top by code -->
  <g>
    <rect x="160" y="300" width="1600" height="36" rx="10" fill="url(#shelf)" stroke="#5b3a29" stroke-width="8"/>
    <rect x="260" y="336" width="18" height="60" fill="#8a5a34"/>
    <rect x="960" y="336" width="18" height="60" fill="#8a5a34"/>
    <rect x="1642" y="336" width="18" height="60" fill="#8a5a34"/>
  </g>
  <g>
    <rect x="160" y="640" width="1600" height="36" rx="10" fill="url(#shelf)" stroke="#5b3a29" stroke-width="8"/>
    <rect x="260" y="676" width="18" height="60" fill="#8a5a34"/>
    <rect x="960" y="676" width="18" height="60" fill="#8a5a34"/>
    <rect x="1642" y="676" width="18" height="60" fill="#8a5a34"/>
  </g>

  <!-- Soft corner bunting for a friendly shop feel -->
  <g stroke="#5b3a29" stroke-width="2">
    <polygon points="40,40 100,40 70,100" fill="#8ed26a"/>
    <polygon points="100,40 160,40 130,100" fill="#ffb877"/>
    <polygon points="1760,40 1820,40 1790,100" fill="#ffb877"/>
    <polygon points="1820,40 1880,40 1850,100" fill="#8ed26a"/>
  </g>
</svg>
